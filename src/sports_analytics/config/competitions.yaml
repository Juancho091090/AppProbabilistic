# Catálogo único de competiciones de fútbol autorizadas.
#
# api_football_id: ID de liga en API-Football v3. Los IDs se verifican en tiempo de
#   ejecución contra el endpoint /leagues (nombre y país); si no coinciden, la
#   competición se marca como no verificada en el log y se omite.
# kind: league | international_club | international_national
# season_mode: calendar  -> temporada = año natural (ligas sudamericanas, MLS…)
#              split     -> temporada europea (ago–may); API-Football usa el año de inicio
# Cualquier competición que NO esté aquí queda excluida automáticamente.

include_friendlies: false

football:
  # --- Ligas nacionales ---
  - key: arg_liga_profesional
    name: Liga Profesional Argentina
    country: Argentina
    api_football_id: 128
    kind: league
    season_mode: calendar
