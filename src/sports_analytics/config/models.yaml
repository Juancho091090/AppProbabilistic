# Parámetros de modelos. Ningún peso o umbral se fija en el código.
# Los pesos de ensemble son VALORES INICIALES: el módulo de calibración los
# re-estima con histórico propio (ver docs/models.md) y escribe la versión
# calibrada en la tabla model_metrics / archivo de pesos calibrados.

version: ensemble_v1

recency:
  # Decay temporal continuo: w = 0.5 ** (días_transcurridos / half_life_days)
  method: exponential        # exponential | buckets
  half_life_days:
    football: 180
    tennis: 120
  # Alternativa por tramos (method: buckets), por número de partidos hacia atrás
  buckets:
    - {last_n: 5, weight: 1.00}
    - {last_n: 10, weight: 0.75}
    - {last_n: 20, weight: 0.50}
    - {last_n: null, weight: 0.25}   # resto del histórico
  # Peso mínimo para no descartar del todo partidos antiguos
  min_weight: 0.05

football:
  elo:
    initial_rating: 1500
    k_factor: 20
    home_advantage: 65          # puntos Elo
    goal_diff_multiplier: true  # K ajustado por margen (fórmula World Football Elo)
    season_regression: 0.20     # regresión a la media entre temporadas
    season_gap_days: 45         # inactividad que se considera cambio de temporada
    draw_model:                 # P(empate) desde diferencia de Elo (logística ordinal)
      base_draw: 0.27
      draw_decay: 0.0008
  poisson:
    max_goals: 10
    min_matches: 6              # mínimo de partidos por equipo para estimar
    prior_strength: 5.0         # partidos "virtuales" de la media de liga (shrinkage)
  dixon_coles:
    rho_default: -0.10
    rho_bounds: [-0.20, 0.05]
    min_matches_fit: 150        # partidos de la liga para estimar rho por MLE
  logistic:
    min_samples: 300            # partidos de entrenamiento mínimos
    C: 1.0
    min_history: 3              # partidos previos por equipo para crear una fila
  corners:
    max_corners: 30
    overdispersion_threshold: 1.10   # var/mean > umbral -> Binomial Negativa
    min_matches: 6
  lines:
    goals: [0.5, 1.5, 2.5, 3.5, 4.5]
    corners: [7.5, 8.5, 9.5, 10.5, 11.5]
  ensemble_weights_1x2:
    dixon_coles: 0.40
    poisson: 0.20
    elo: 0.25
    logistic: 0.15

tennis:
  elo:
    initial_rating: 1500
    # K dinámico (FiveThirtyEight): K = k_base / (n_partidos + offset) ** shape
    k_base: 250
    k_offset: 5
    k_shape: 0.4
    surface_min_matches: 10     # bajo esto, Elo superficie se mezcla con general
    surface_blend_prior: 15     # peso n/(n+prior) para superficie
  markov:
    # Prob. de ganar punto al saque cuando no hay estadísticas
    default_spw: {ATP: 0.64, WTA: 0.56}
    tour_avg_rpw: {ATP: 0.36, WTA: 0.44}
    stats_shrink_prior: 15      # shrinkage de estadísticas de superficie hacia el total
    min_stats_matches: 5        # partidos con estadísticas para usar Barnett-Clarke
    final_set_tiebreak: 7
    grand_slam_final_set_tiebreak: 10
  logistic:
    min_samples: 300
    C: 1.0
    min_history: 5
  lines:
    games: [18.5, 19.5, 20.5, 21.5, 22.5, 23.5, 36.5, 38.5]
  ensemble_weights_winner:
    elo: 0.30
    surface_elo: 0.30
    logistic: 0.20
    markov: 0.20

calibration:
  min_samples_platt: 200
  min_samples_isotonic: 1000
  n_bins: 10
  # Recalibración multinomial del 1X2 (q_k ∝ p_k^a · e^{b_k}): corrige que el ensemble
  # sea demasiado conservador y el sesgo local/visitante. Se ajusta con predicciones
  # walk-forward del histórico (comando fit-recalibration, semanal) y solo se aplica si
  # mejora la log-loss en el tramo final reservado (holdout, fuera de muestra).
  recalibration_1x2:
    enabled: true
    window_days: 150        # histórico walk-forward usado para ajustar
    refit_days: 7           # reentrenamiento del backtest interno
    holdout_fraction: 0.3   # último 30 % (cronológico) para validar
    l2: 1.0                 # penalización hacia la identidad (a=1, b=0)
    min_samples: 300        # partidos mínimos para ajustar
    max_age_days: 21        # parámetros más antiguos se ignoran

confidence:
  # Puntuación 0-1 combinando calidad de datos y acuerdo entre modelos
  high: 0.70
  medium: 0.45
  max_model_spread: 0.15        # desacuerdo máximo tolerable entre modelos (prob.)

# Benchmark de mercado: probabilidades implícitas 1X2 (sin margen) usadas SOLO para
# evaluar el modelo en backtesting y métricas vivas. Nunca se muestran en el informe.
market:
  enabled: true
  bet_id: 1                  # "Match Winner" en API-Football
  preferred_bookmakers: [4]  # 4 = Pinnacle (margen bajo); si no está, se usa el consenso
  fallback: consensus        # consensus | none
  devig_method: proportional # reparte el margen en proporción a cada implícita
  bootstrap_samples: 2000    # IC 95 % de la diferencia de log-loss
