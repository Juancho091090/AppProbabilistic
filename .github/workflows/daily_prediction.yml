name: daily-prediction

# Horario (America/Bogota = UTC-5 todo el año, sin horario de verano):
# * Desde el 25-oct-2026, TODOS los días: informe la NOCHE ANTERIOR con los partidos del día
#   siguiente (hay tenis y ligas que empiezan de madrugada). cron 23:45 UTC = 18:45 Bogotá,
#   para llegar hacia las 19:00. Ya no hay corrida por la mañana.
# Respaldo: GitHub dispara sus cron tarde o no los dispara. Una tarea programada externa
# llama a workflow_dispatch con skip_if_sent=true a las 18:49; si el informe de esa fecha ya
# salió, la corrida termina antes de llamar a ninguna API (no gasta cuota ni reenvía).
# Los cron van fuera del minuto 00: GitHub retrasa (o incluso omite) los cron en punto.
on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "Enviar por Telegram/Email"
        type: boolean
        default: true
      days_ahead:
        description: "0 = partidos de hoy · 1 = partidos de mañana (horario normal)"
        type: choice
        options: ["0", "1"]
        default: "1"
      skip_if_sent:
        description: "No reenviar si el informe de esa fecha ya salió (respaldo programado)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-prediction
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_TIMEZONE: America/Bogota
      LOG_LEVEL: INFO
      # Programadas y respaldo (skip_if_sent): si el informe de esa fecha ya salió, no reenviar
      SKIP_IF_ALREADY_SENT: ${{ github.event_name == 'schedule' || inputs.skip_if_sent == true }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_DAILY_LIMIT: "7000"      # plan Pro: 7.500/día (margen de seguridad)
      TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
      TENNIS_API_DAILY_LIMIT: "45"          # plan Basic: 50/día
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Caché HTTP + contador de cuota diaria entre ejecuciones
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Instalar dependencias
        run: pip install -e .

      - name: Verificar base de datos configurada
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL (PostgreSQL persistente, p. ej. Neon). Ver docs/deployment.md"
            exit 1
          fi

      - name: Migraciones
        run: alembic upgrade head

      - name: Pipeline diario (ingesta, resultados, modelos, informe, envío)
        run: |
          AHEAD="${{ inputs.days_ahead || '0' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Cron de las 18:45; si GitHub lo dispara tan tarde que en Bogotá ya es el día
            # siguiente (antes del mediodía), el informe que tocaba ya es el de HOY.
            AHEAD=1
            [ "$(TZ=America/Bogota date +%H)" -lt 12 ] && AHEAD=0
          fi
          echo "Informe de los partidos de: $(TZ=America/Bogota date -d "+$AHEAD day" +%F) (days_ahead=$AHEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send }}" = "false" ]; then
            sports-analytics run-daily --no-send --days-ahead "$AHEAD" --output reports/output/daily.md
          else
            sports-analytics run-daily --days-ahead "$AHEAD" --output reports/output/daily.md
          fi

      - name: Resumen en GitHub
        if: always()
        run: |
          if [ -f reports/output/daily.md ]; then
            cat reports/output/daily.md >> "$GITHUB_STEP_SUMMARY"
            python -c "from sports_analytics.diagnostics import emit_annotations; emit_annotations(open('reports/output/daily.md', encoding='utf-8').read())"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-diario-${{ github.run_id }}
          path: reports/output/
          retention-days: 30
          if-no-files-found: ignore

  # Registro simulado (sin dinero real): publica el estado en la rama metrics-data
  # (paper/latest.json y paper/sheet_update.json) para la sincronización con Google Sheets.
  registro-simulado:
    needs: daily
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_TIMEZONE: America/Bogota
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: alembic upgrade head
      - name: Exportar registro
        run: sports-analytics export-paper --output-dir "$RUNNER_TEMP/paper"
      - name: Publicar en la rama metrics-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics-data
          git switch -C metrics-data origin/metrics-data
          mkdir -p paper
          cp "$RUNNER_TEMP/paper/latest.json" "$RUNNER_TEMP/paper/sheet_update.json" paper/
          git add paper
          git commit -m "registro simulado $(TZ=America/Bogota date +%F-%H%M) (run ${GITHUB_RUN_ID})" || exit 0
          git push origin metrics-data
